<!doctype html>
<html lang="tr">
<head>

<title>ReadShift</title>
<style>
:root{--bg:#0b0a12;--panel:#15131f;--panel2:#1c1928;--ink:#f8f7ff;--muted:#9b96ad;--v:#8b5cf6;--c:#2dd4bf;--pink:#ec4899;--line:#2a2639;--ok:#34d399;--bad:#fb7185}*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(800px 480px at 85% -5%,#33215f55,transparent 60%),var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,sans-serif;min-height:100%;overscroll-behavior:none}button,input{font:inherit;color:inherit}button{cursor:pointer}.app{max-width:620px;margin:auto;min-height:100vh;padding:calc(20px + env(safe-area-inset-top)) 18px calc(100px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-weight:900;letter-spacing:.18em;font-size:11px;color:#bcb5d3}.top h1{font-size:27px;margin:4px 0}.badge{padding:8px 12px;border:1px solid #3a3353;border-radius:999px;background:#191627;color:#c9b9ff;font-weight:800}.hero{display:flex;justify-content:space-between;gap:14px;align-items:center;background:linear-gradient(135deg,#211a36,#151320);border:1px solid #342d4c;border-radius:26px;padding:20px;box-shadow:0 16px 50px #0007}.kicker{font-size:10px;letter-spacing:.16em;color:#9d8fbc;font-weight:900}.hero h2{font-size:42px;line-height:1;margin:8px 0}.hero h2 small{font-size:13px;color:#a59db6}.hero p{color:#aaa3b8;max-width:300px}.ring{width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--v) var(--p),#2b2738 0);display:grid;place-items:center;flex:0 0 auto}.ring:after{content:attr(data-v);display:grid;place-items:center;width:70px;height:70px;border-radius:50%;background:#171420;font-weight:900}.primary,.secondary,.ghost{border:0;border-radius:15px;padding:13px 16px;font-weight:900}.primary{background:linear-gradient(135deg,#8b5cf6,#6d48e5);box-shadow:0 10px 30px #6d48e544}.secondary{background:#232030;border:1px solid #363147}.ghost{background:transparent;border:1px solid #332f43;color:#b9b2c8}.wide{width:100%;margin-top:10px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 24px}.metric{background:#13111b;border:1px solid #242130;border-radius:18px;padding:14px}.metric b{display:block;font-size:19px}.metric span{color:#8f899f;font-size:11px}.section{margin:24px 0}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.sectionhead h3{margin:2px 0;font-size:20px}.list{display:grid;gap:10px}.card{width:100%;text-align:left;display:flex;align-items:center;gap:13px;background:#14121d;border:1px solid #272334;border-radius:19px;padding:14px}.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#33245d;color:#d8c8ff;font-size:21px}.ico.c{background:#153e3a;color:#70f0db}.ico.p{background:#47203e;color:#ff9bd2}.ico.b{background:#38321a;color:#ffe27e}.copy{flex:1}.copy b{display:block}.copy small{color:#918a9e}.tag{color:#a89bbc;background:#211d2b;border-radius:99px;padding:6px 9px;font-size:10px}.bottom{position:fixed;bottom:0;left:0;right:0;max-width:620px;margin:auto;height:78px;padding:8px 9px calc(8px + env(safe-area-inset-bottom));background:#0d0c13ee;backdrop-filter:blur(18px);border-top:1px solid #282431;display:grid;grid-template-columns:repeat(5,1fr);z-index:10}.nav{background:none;border:0;color:#777184;font-size:9px;display:grid;place-items:center;gap:2px}.nav i{font-style:normal;font-size:20px}.nav.on{color:#b8a3ff}.screen{animation:in .22s ease}@keyframes in{from{opacity:.4;transform:translateY(5px)}}.notice{padding:13px 15px;border-radius:16px;background:#171423;border:1px solid #2e2842;color:#afa6c1;margin:12px 0}.readerhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.close{width:42px;height:42px;border-radius:14px;background:#17151f;border:1px solid #302b3d}.stage{min-height:350px;border:1px solid #302b3e;border-radius:26px;background:radial-gradient(circle at center,#211b35,#121019 65%);display:grid;place-items:center;position:relative;overflow:hidden}.focus{position:absolute;top:36px;bottom:36px;width:1px;background:#6d5a9438}.word{font-size:42px;font-weight:900;letter-spacing:.02em;z-index:1}.word strong{color:#b497ff}.bar{position:absolute;left:20px;right:20px;bottom:24px;height:4px;border-radius:99px;background:#2e293a}.bar i{display:block;height:100%;background:var(--v);border-radius:99px}.count{position:absolute;bottom:34px;color:#716a7c;font-size:11px}.controlrow{display:flex;justify-content:center;align-items:center;gap:16px;margin:22px}.round{width:64px;height:64px;border-radius:50%;border:0;background:var(--v);font-size:22px;box-shadow:0 12px 32px #7651e055}.speed{display:flex;justify-content:center;gap:18px;align-items:center;margin-top:18px}.speed button{width:42px;height:42px;border-radius:13px;background:#191622;border:1px solid #312c3e}.reading{font:18px/1.82 Georgia,serif;background:#121018;border:1px solid #282333;border-radius:22px;padding:22px;color:#e8e5f0}.reading span.past{color:#6f6979}.reading span.now{background:#8b5cf63a;color:white;border-radius:5px}.quiz h2{font-size:25px}.opt{width:100%;padding:15px;margin:7px 0;text-align:left;border-radius:15px;border:1px solid #312c40;background:#17141f}.opt.good{border-color:#2b8a69;background:#15352d}.opt.bad{border-color:#a23b65;background:#361727}.result{text-align:center;padding-top:34px}.result .orb{width:94px;height:94px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:linear-gradient(145deg,#8b5cf6,#2dd4bf);font-size:40px}.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0}.rgrid div{background:#15131d;border:1px solid #292536;border-radius:17px;padding:16px}.rgrid b{display:block;font-size:24px}.rgrid span{font-size:10px;color:#938c9f}.chart{height:180px;display:flex;align-items:end;gap:8px;background:#13111a;border:1px solid #25212f;border-radius:21px;padding:18px}.chart i{flex:1;border-radius:7px 7px 3px 3px;background:linear-gradient(#9d79ff,#5f3dcc);min-height:7px}.library{display:grid;grid-template-columns:1fr 1fr;gap:10px}.book{background:#15131e;border:1px solid #292536;border-radius:20px;padding:14px}.cover{height:86px;border-radius:14px;background:linear-gradient(135deg,#6d4de7,#1e7f76);display:grid;place-items:center;font-size:31px}.toggle{float:right;width:48px;height:28px;border:0;border-radius:20px;background:#373243;position:relative}.toggle:after{content:'';position:absolute;width:22px;height:22px;top:3px;left:3px;background:white;border-radius:50%;transition:.2s}.toggle.on{background:var(--v)}.toggle.on:after{left:23px}.setting{padding:16px 0;border-bottom:1px solid #26222f}.setting b{display:block}.setting small{color:#8f899e}.spanbox{min-height:330px;border-radius:26px;border:1px solid #302b3e;background:radial-gradient(circle,#211b35,#111019 65%);display:grid;place-items:center;text-align:center}.fix{font-size:30px;color:#756b87}.phrase{font-size:24px;font-weight:800;max-width:260px}.dots{display:flex;gap:7px;justify-content:center;margin:18px}.dots i{width:7px;height:7px;border-radius:50%;background:#332e40}.dots i.done{background:var(--c)}.answer{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer button{padding:14px;border-radius:14px;border:1px solid #343042;background:#18151f}.answer button:last-child{background:#183830;border-color:#2a6f5b}@media(max-width:390px){.hero{align-items:flex-start}.ring{width:76px;height:76px}.ring:after{width:58px;height:58px}.hero h2{font-size:36px}.metrics{gap:7px}.metric{padding:11px}.app{padding-left:14px;padding-right:14px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><div id="root"></div><script>
'use strict';
const texts=[
{id:'forest',title:'Ormanın Sessiz Ağı',cat:'Bilim',text:'Bir ormanda ağaçlar dışarıdan bakıldığında birbirinden ayrı bireyler gibi görünür. Oysa toprağın altında kökler ve mantarların oluşturduğu karmaşık bir ilişki ağı bulunur. Mantar iplikleri bitki kökleriyle ortaklık kurarak su ve minerallerin taşınmasına yardım eder. Bitki ise fotosentezle ürettiği organik moleküllerin bir bölümünü mantara aktarır. Bu ilişki tek yönlü bir alışveriş değildir; çevresel koşullara, türlere ve toprağın yapısına göre sürekli değişir. Araştırmacılar bu ağların orman ekosistemindeki madde döngüsünü ve bazı bitkilerin stres koşullarına verdiği yanıtları etkileyebildiğini gözlemliyor. Fakat bu durum ağaçların insanlardaki gibi bilinçli kararlar aldığı anlamına gelmez. Bilimsel açıdan daha dikkatli ifade farklı canlıların kimyasal ve fiziksel süreçlerle birbirlerinin yaşam koşullarını etkilediğidir. Bir ekosisteme dikkatle bakıldığında tek tek parçaların ötesinde düzenli ilişkiler ve karşılıklı bağımlılıklar görülür.',qs:[['Bitki mantara ne aktarır?',['Organik moleküller','Işık','Toprak','Basınç'],0],['Metin hangi yoruma karşı uyarır?',['Ağaçların bilinçli karar aldığına','Köklerin toprakta olduğuna','Fotosenteze','Mineral taşınmasına'],0]]},
{id:'memory',title:'Hafızanın İzleri',cat:'Zihin',text:'Yeni bir bilgiyi kalıcı öğrenmek yalnızca aynı cümleyi tekrar tekrar görmekle gerçekleşmez. Hatırlama sırasında beyin daha önce kurulmuş bağlantıları yeniden etkinleştirir ve bilgiye ulaşmaya çalışır. Bu nedenle aralıklı tekrar ve aktif hatırlama uzun süreli öğrenmede güçlü yöntemlerdir. Bir konuyu kapattıktan sonra ana fikri kendi kelimelerinle anlatmak yalnızca metne yeniden bakmaktan daha fazla zihinsel çaba ister. Bu çaba ilk anda zorlayıcı olabilir; fakat tam da bu zorluk hangi bağlantıların sağlam hangilerinin eksik olduğunu görünür kılar. Uyku da öğrenmenin önemli bir parçasıdır. Gün içinde edinilen bazı anıların daha kararlı hale gelmesi uyku süreçleriyle ilişkilidir. Etkili çalışma öğrenme hatırlama dinlenme ve yeniden değerlendirme döngüsünü iyi kurmayı gerektirir.',qs:[['Aktif hatırlama neyi görünür kılar?',['Eksik bağlantıları','Ekran parlaklığını','Okuma süresini','Yazı tipini'],0],['Metne göre uyku neyle ilişkilidir?',['Bazı anıların kararlı hale gelmesiyle','Okuma hızının ölçülmesiyle','Metnin kısalmasıyla','Göz hareketleriyle'],0]]},
{id:'deep',title:'Derin Denizde Yaşam',cat:'Doğa',text:'Güneş ışığının ulaşmadığı derin deniz bölgeleri ilk bakışta yaşam için elverişsiz görünebilir. Yüksek basınç düşük sıcaklık ve sınırlı besin kaynakları burada yaşayan canlılar için güçlü çevresel seçilim baskıları oluşturur. Buna rağmen hidrotermal bacaların çevresinde dikkat çekici topluluklar bulunur. Bu bölgelerde bazı mikroorganizmalar enerji ihtiyaçlarını güneşten değil kimyasal bileşiklerin yükseltgenmesinden karşılar. Kemosentez olarak adlandırılan bu süreç organik maddenin üretilebilmesi için farklı bir enerji kaynağı sunar. Tüp solucanları gibi daha büyük canlılar da kimi zaman bu mikroorganizmalarla yakın ortaklıklar içinde yaşar. Bu örnekler yaşamın uygun enerji akışı ve moleküler düzenekler bulunduğunda çok farklı koşullara uyum gösterebildiğini ortaya koyar.',qs:[['Bazı mikroorganizmalar enerjiyi nereden sağlar?',['Kimyasal bileşiklerden','Ay ışığından','Basınçtan','Tuzdan'],0],['Metnin ana fikri nedir?',['Yaşam farklı enerji kaynaklarına uyum gösterebilir','Derin denizde yaşam yoktur','Fotosentez her yerde zorunludur','Basınç yaşamı tamamen engeller'],0]]},
{id:'city',title:'Şehrin Ritmi',cat:'Kültür',text:'Bir şehrin ritmini yalnızca trafik yoğunluğu ya da nüfus sayısı belirlemez. İnsanların işe gidiş saatleri parkların ne zaman dolduğu küçük dükkânların açılış düzeni toplu taşımanın aralıkları ve gün ışığının mevsimsel değişimi gündelik yaşamın temposunu oluşturur. Sabah saatlerinde aynı cadde hızlı ve amaçlı bir akışa sahipken akşamüstü aynı alan karşılaşmaların ve kısa sohbetlerin mekânına dönüşebilir. Kent tasarımcıları için bu ritmi anlamak önemlidir; çünkü iyi bir kamusal alan yalnızca fiziksel olarak güzel değil farklı saatlerde farklı ihtiyaçlara cevap verebilen bir alan olmalıdır.',qs:[['Şehrin ritmini ne oluşturur?',['Çeşitli gündelik zaman örüntüleri','Yalnızca nüfus','Yalnızca trafik','Sadece mimari'],0],['İyi kamusal alan nasıl tanımlanır?',['Farklı zamanlarda farklı ihtiyaçlara cevap veren','Her saatte aynı kullanılan','Yalnızca güzel görünen','Sadece trafiğe kapalı'],0]]}
];
const D={xp:0,level:1,streak:0,target:280,best:0,base:0,baseComp:0,sessions:[],last:'',minutes:12,haptic:true};let s;try{s={...D,...JSON.parse(localStorage.rs||'{}')}}catch{s={...D}}let tab='home',timer=null,timers=[];const root=document.getElementById('root');
const save=()=>localStorage.rs=JSON.stringify(s),eff=(w,c)=>Math.round(w*c/100),wc=t=>t.trim().split(/\s+/).length,hap=()=>{if(s.haptic&&window.ReadShiftNative)try{ReadShiftNative.haptic()}catch{}},pick=()=>texts[Math.floor(Math.random()*texts.length)],today=()=>new Date().toISOString().slice(0,10),yday=()=>new Date(Date.now()-86400000).toISOString().slice(0,10);function clearAll(){clearInterval(timer);clearTimeout(timer);timers.forEach(x=>{clearInterval(x);clearTimeout(x)});timers=[];timer=null}
function nav(){return `<div class="bottom">${[['home','⌂','Ana'],['train','⚡','Antrenman'],['progress','▥','Gelişim'],['library','▤','Metinler'],['settings','⚙','Ayarlar']].map(x=>`<button class="nav ${tab===x[0]?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}</div>`}function page(x){root.innerHTML=`<div class="app screen">${x}</div>${nav()}`}window.go=t=>{clearAll();tab=t;render()};
function top(title){return `<div class="top"><div><div class="brand">READSHIFT</div><h1>${title}</h1></div><div class="badge">✦ Lv. ${s.level}</div></div>`}function metric(v,l){return `<div class="metric"><b>${v}</b><span>${l}</span></div>`}function workout(ic,c,title,sub,type){return `<button class="card" onclick="start('${type}')"><span class="ico ${c}">${ic}</span><span class="copy"><b>${title}</b><small>${sub}</small></span><span class="tag">Başla</span></button>`}
function home(){let r=s.sessions.slice(-5),av=r.length?Math.round(r.reduce((a,b)=>a+b.e,0)/r.length):0,p=Math.min(100,r.length*20),base=s.base?eff(s.base,s.baseComp||100):0,delta=base&&av?Math.round((av-base)/base*100):0;page(`${top('Bugünkü akış')}<div class="hero"><div><div class="kicker">KİŞİSEL HEDEF</div><h2>${s.target}<small> WPM</small></h2><p>Hızı artırırken anlamayı %80’in üzerinde tut. Etkili WPM ikisini birlikte ölçer.</p><button class="primary" onclick="start('rsvp')">▶ Günlük antrenman</button></div><div class="ring" style="--p:${p}%" data-v="${p}%"></div></div><div class="metrics">${metric(s.streak+' gün','seri')}${metric(s.best||'—','en iyi WPM')}${metric(delta?((delta>0?'+':'')+delta+'%'):'—','etkili artış')}</div><div class="section"><div class="sectionhead"><div><div class="kicker">AKILLI PLAN</div><h3>Bugünkü set</h3></div></div><div class="list">${workout('◴','','RSVP Sprint',s.target+' WPM · merkez odak','rsvp')}${workout('↗','c','Satır Pacer',Math.max(170,s.target-30)+' WPM · akış','pacer')}${workout('◎','p','Görüş Alanı','kelime blokları · çevresel farkındalık','span')}${workout('◆','b','Doğal Hız Testi','hız + anlama kalibrasyonu','baseline')}</div></div>`) }
function train(){page(`${top('Antrenman')}<div class="notice">Hedef hız, son beş oturumundaki anlama oranına göre otomatik ayarlanır. %85 ve üzeri anlayışta kademeli yükselir; %70 altındaysa düşer.</div><div class="list">${workout('◴','','RSVP Sprint','merkez odak · kelime ritmi','rsvp')}${workout('↗','c','Satır Pacer','görsel akış · satır takibi','pacer')}${workout('◎','p','Görüş Alanı','üçlü kelime blokları','span')}${workout('◆','b','Başlangıç Ölçümü','doğal WPM + anlama','baseline')}</div>`)}
function progress(){let a=s.sessions.slice(-10),avg=a.length?Math.round(a.reduce((x,y)=>x+y.c,0)/a.length):0;page(`${top('Gelişim')}<div class="metrics">${metric(s.best||'—','tepe WPM')}${metric(s.target,'hedef WPM')}${metric(avg?('%'+avg):'—','ortalama anlama')}</div><div class="section"><div class="sectionhead"><h3>Etkili WPM</h3></div><div class="chart">${(a.length?a:[{e:5}]).map(x=>`<i style="height:${Math.max(7,Math.min(100,x.e/6))}%"></i>`).join('')}</div></div><div class="notice">Etkili WPM = okuma hızı × anlama oranı. Böylece uygulama yalnızca metni hızlı geçmeyi değil, anlamayı koruyarak hızlanmayı ödüllendirir.</div>`)}
function library(){page(`${top('Metinler')}<div class="library">${texts.map((t,i)=>`<div class="book"><div class="cover">${['⌁','◎','≈','⌂'][i]}</div><div class="kicker" style="margin-top:12px">${t.cat}</div><b>${t.title}</b><p style="color:#918a9f;font-size:11px">${wc(t.text)} kelime</p><button class="ghost wide" onclick="start('baseline','${t.id}')">Oku</button></div>`).join('')}</div>`)}
function settings(){page(`${top('Ayarlar')}<div class="setting"><button class="toggle ${s.haptic?'on':''}" onclick="s.haptic=!s.haptic;save();settings()"></button><b>Dokunsal geri bildirim</b><small>Önemli eylemlerde kısa titreşim.</small></div><div class="setting"><b>Günlük süre</b><small>${s.minutes} dakika</small><input style="width:100%;accent-color:#8b5cf6" type="range" min="5" max="30" value="${s.minutes}" oninput="s.minutes=+this.value;save();settings()"></div><div class="setting"><b>Çevrimdışı kullanım</b><small>İlerleme bu cihazdaki yerel depoda saklanır; temel egzersizler internetsiz çalışır.</small></div><button class="ghost wide" onclick="if(confirm('İlerleme sıfırlansın mı?')){localStorage.removeItem('rs');location.reload()}">İlerlemeyi sıfırla</button>`)}function render(){({home,train,progress,library,settings}[tab]||home)()}
window.start=(type,id)=>{hap();clearAll();let t=texts.find(x=>x.id===id)||pick();if(type==='rsvp')rsvp(t);else if(type==='pacer')pacer(t);else if(type==='span')span();else baseline(t)};function closeX(){clearAll();render()}window.closeX=closeX;function shell(body){root.innerHTML=`<div class="app screen"><div class="readerhead"><button class="close" onclick="closeX()">←</button><div class="brand">READSHIFT TRAINING</div><span></span></div>${body}</div>`}
function baseline(t){let started=0;shell(`<div class="kicker">DOĞAL OKUMA TESTİ</div><h1>${t.title}</h1><p style="color:#9a93a9">Hazır olduğunda başla. Hızlanmaya çalışma; doğal okuma hızını ölçüyoruz.</p><div class="reading" id="txt" style="display:none">${t.text}</div><button class="primary wide" id="b">▶ Başlat</button>`);document.getElementById('b').onclick=()=>{if(!started){started=Date.now();document.getElementById('txt').style.display='block';document.getElementById('b').textContent='✓ Okudum'}else{let sec=Math.max(5,(Date.now()-started)/1000);quiz(t,Math.round(wc(t.text)/(sec/60)),'baseline',sec)}}}
function rsvp(t){let words=t.text.split(/\s+/),i=0,spd=s.target,run=false,ms=0,last=0;shell(`<div class="kicker">RSVP SPRINT</div><h1>Merkezde kal</h1><p style="color:#9991a6">Kelimenin vurgu harfini ortada tut; gözün satır boyunca gezinmesin.</p><div class="stage"><div class="focus"></div><div class="word" id="w"></div><div class="bar"><i id="pb"></i></div><span class="count" id="ct"></span></div><div class="speed"><button id="minus">−</button><b id="sv">${spd} WPM</b><button id="plus">+</button></div><div class="controlrow"><button class="round" id="play">▶</button><button class="secondary" id="done">Bitir</button></div>`);const draw=()=>{let x=words[i],p=Math.floor(x.length*.42);document.getElementById('w').innerHTML=`${x.slice(0,p)}<strong>${x[p]||''}</strong>${x.slice(p+1)}`;document.getElementById('pb').style.width=((i+1)/words.length*100)+'%';document.getElementById('ct').textContent=(i+1)+' / '+words.length};const stop=()=>{if(timer)clearInterval(timer);timer=null;if(run){ms+=Date.now()-last}run=false;document.getElementById('play').textContent='▶'};const go=()=>{if(run)return stop();run=true;last=Date.now();document.getElementById('play').textContent='Ⅱ';timer=setInterval(()=>{if(i>=words.length-1)return stop();i++;draw()},60000/spd)};document.getElementById('play').onclick=go;document.getElementById('minus').onclick=()=>{stop();spd=Math.max(140,spd-20);document.getElementById('sv').textContent=spd+' WPM'};document.getElementById('plus').onclick=()=>{stop();spd=Math.min(900,spd+20);document.getElementById('sv').textContent=spd+' WPM'};document.getElementById('done').onclick=()=>{stop();let sec=Math.max(5,(ms||words.length/spd*60000)/1000);quiz(t,Math.round(words.length/(sec/60)),'rsvp',sec)};draw()}
function pacer(t){let words=t.text.split(/\s+/),i=0,spd=Math.max(160,s.target-30),start=0;shell(`<div class="kicker">SATIR PACER</div><h1>${t.title}</h1><p style="color:#9991a6">Vurgulanan akışın hemen arkasında kalmadan okumaya çalış.</p><div class="reading" id="read">${words.map((x,j)=>`<span data-i="${j}">${x} </span>`).join('')}</div><div class="controlrow"><button class="round" id="pp">▶</button><button class="secondary" id="pd">Bitir</button></div>`);let ss=[...document.querySelectorAll('#read span')],run=false;const draw=()=>ss.forEach((x,j)=>x.className=j<i?'past':j===i?'now':'');const stop=()=>{if(timer)clearInterval(timer);timer=null;run=false;document.getElementById('pp').textContent='▶'};document.getElementById('pp').onclick=()=>{if(run)return stop();run=true;if(!start)start=Date.now();document.getElementById('pp').textContent='Ⅱ';timer=setInterval(()=>{if(i>=words.length-1)return stop();i++;draw()},60000/spd)};document.getElementById('pd').onclick=()=>{stop();let sec=Math.max(5,(Date.now()-(start||Date.now()-words.length/spd*60000))/1000);quiz(t,Math.round(words.length/(sec/60)),'pacer',sec)};draw()}
function span(){let phrases=['bilginin sessiz düzeni','dikkatin geniş alanı','anlamlı küçük parçalar','gözün doğal ritmi','düşüncenin açık yolu','okumanın sakin akışı','merkezden çevreye bak','bütünlüğü birden fark et','kelimeleri grup olarak gör','ritmi anlamla koru'],r=0,h=0,start=Date.now(),t=texts[1];const draw=()=>{shell(`<div class="kicker">GÖRÜŞ ALANI</div><h1>Kelime blokları</h1><p style="color:#9991a6">Merkez noktasına bak. Blok kısa süre göründüğünde bütünü tek bakışta fark etmeye çalış.</p><div class="spanbox"><div><div class="fix">+</div><div class="phrase" id="ph" style="visibility:hidden">${phrases[r]}</div></div></div><div class="dots">${phrases.map((_,i)=>`<i class="${i<r?'done':''}"></i>`).join('')}</div><button class="primary wide" id="show">✦ Göster</button>`);document.getElementById('show').onclick=()=>{hap();document.getElementById('ph').style.visibility='visible';let x=setTimeout(()=>{document.getElementById('ph').style.visibility='hidden';document.getElementById('show').outerHTML=`<div class="answer"><button id="miss">Tam göremedim</button><button id="hit">Gördüm ✓</button></div>`;document.getElementById('miss').onclick=()=>next(false);document.getElementById('hit').onclick=()=>next(true)},Math.max(330,60000/s.target*2.6));timers.push(x)}};const next=ok=>{if(ok)h++;if(r>=9){let sec=Math.max(10,(Date.now()-start)/1000),w=Math.round(s.target*(.75+h/40));quiz(t,w,'span',sec);return}r++;draw()};draw()}
function quiz(t,wpm,type,sec){let qi=0,correct=0;const draw=()=>{let [q,opts,ans]=t.qs[qi];shell(`<div class="quiz"><div class="kicker">ANLAMA KONTROLÜ · ${qi+1}/${t.qs.length}</div><h2>${q}</h2>${opts.map((o,i)=>`<button class="opt" data-i="${i}"><b>${String.fromCharCode(65+i)}.</b> ${o}</button>`).join('')}</div>`);document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{let chosen=+b.dataset.i;if(chosen===ans)correct++;document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===ans)x.classList.add('good');else if(x===b)x.classList.add('bad')});let z=setTimeout(()=>{if(qi<t.qs.length-1){qi++;draw()}else finish(wpm,Math.round(correct/t.qs.length*100),type,sec)},520);timers.push(z)})};draw()}
function finish(w,c,type,sec){let e=eff(w,c),d=today(),x=Math.round(e/10+20);if(s.last!==d){s.streak=s.last===yday()?s.streak+1:1;s.last=d}s.sessions.push({date:d,w,c,e,type,sec:Math.round(sec||0)});s.sessions=s.sessions.slice(-120);s.xp+=x;s.level=Math.floor(Math.sqrt(s.xp/140))+1;s.best=Math.max(s.best,w);if(type==='baseline'){s.base=w;s.baseComp=c}let last=s.sessions.slice(-5),av=last.reduce((a,b)=>a+b.c,0)/last.length,aw=last.reduce((a,b)=>a+b.w,0)/last.length;s.target=Math.max(140,Math.min(900,Math.round((av>=85?aw*1.08:av<70?aw*.92:aw)/10)*10));save();shell(`<div class="result"><div class="orb">◆</div><div class="kicker">OTURUM TAMAMLANDI</div><h1>${c>=80?'Güçlü denge!':'Anlamayı koruyalım'}</h1><p style="color:#9991a6">Hedef hızın, bu sonuç ve son oturumların anlama dengesiyle güncellendi.</p><div class="rgrid"><div><b>${w}</b><span>WPM</span></div><div><b>%${c}</b><span>ANLAMA</span></div><div><b>${e}</b><span>ETKİLİ WPM</span></div></div><div class="notice">+${x} XP · Yeni hedef ${s.target} WPM</div><button class="primary wide" onclick="closeX()">Ana ekrana dön</button></div>`)}
render();
</script></body></html>
