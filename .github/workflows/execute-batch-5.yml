name: Execute final Math-CS cleanup and release batch

on:
  push:
    branches: [main]
    paths: [.github/workflows/execute-batch-5.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/math-cs-conversion
          fetch-depth: 0
      - name: Install dependencies
        run: |
          npm cache clean --force
          npm ci --include=optional
      - name: Remove superseded application surfaces
        run: |
          set -euo pipefail
          git rm -rf --ignore-unmatch \
            site \
            API_SUMMARY.md \
            benchmark.js \
            verify_gaussian.py \
            components/WolframHelper.tsx \
            utils/examStorage.ts \
            utils/gaussianSteps.ts \
            utils/usePersistedState.ts \
            views/AreaUnderCurveView.tsx \
            views/BasicsView.tsx \
            views/CheatSheetView.tsx \
            views/CobwebView.tsx \
            views/ContinuityView.tsx \
            views/DerivativesRulesView.tsx \
            views/DeterminantView.tsx \
            views/DiffEq3DView.tsx \
            views/DiffEqBasicsView.tsx \
            views/EigenView.tsx \
            views/ExamAnalysisView.tsx \
            views/ExercisesView.tsx \
            views/FinalExamView.tsx \
            views/FunctionAnalysisView.tsx \
            views/FunctionsView.tsx \
            views/GaussianView.tsx \
            views/IntegralBasicsView.tsx \
            views/IntegralRulesView.tsx \
            views/Integrals3DView.tsx \
            views/InverseView.tsx \
            views/LinearTransformation3DView.tsx \
            views/NewtonView.tsx \
            views/OperationsView.tsx \
            views/PopulationModelsView.tsx \
            views/RadioactiveDecayView.tsx \
            views/Sequences3DView.tsx \
            views/SequencesView.tsx \
            views/SeriesView.tsx \
            views/Surface3DView.tsx \
            views/SystemsView.tsx \
            views/TaylorSeriesView.tsx \
            views/TransformationsView.tsx \
            views/VectorOperations3DView.tsx

          find docs/superpowers -type f \
            ! -name '2026-08-06-math-cs-design.md' \
            ! -name '2026-08-06-math-cs.md' \
            ! -name '2026-08-06-math-cs-review-notes.md' \
            -print -delete

          cat > types.ts <<'EOF'
          import type React from 'react';
          import type { CourseId, TopicId } from './domain/curriculum';

          export type MatrixData = number[][];

          export interface MatrixProps {
            data: MatrixData;
            label?: string;
            editable?: boolean;
            onChange?: (newData: MatrixData) => void;
            highlightRow?: number | null;
            highlightCol?: number | null;
            color?: 'blue' | 'green' | 'purple' | 'orange' | 'pink' | 'red' | 'cyan';
          }

          export enum OperationType {
            ADD = 'ADD',
            SUBTRACT = 'SUBTRACT',
            MULTIPLY = 'MULTIPLY',
            SCALAR = 'SCALAR',
          }

          export type AppSection =
            | 'dashboard'
            | 'course'
            | 'lesson'
            | 'math-lab'
            | 'practice'
            | 'exams'
            | 'progress'
            | 'formulas'
            | 'assistant';

          export type MathLabId = 'function' | 'matrix' | 'vector-geometry';

          export interface AppDestination {
            section: AppSection;
            courseId?: CourseId;
            topicId?: TopicId;
            labId?: MathLabId;
          }

          export type IconComponent = React.ComponentType<{ size?: number; className?: string }>;
          EOF
      - name: Finalize web identity and dependencies
        run: |
          set -euo pipefail
          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
              <meta name="theme-color" content="#07111f" />
              <meta name="description" content="Interactive Mathematical Analysis and Linear Algebra & Geometry for computer science." />
              <meta name="application-name" content="Inmerson Math-CS" />
              <link rel="manifest" href="/Math-CS/manifest.json" />
              <title>Inmerson Math-CS • Interactive Mathematics for Computer Science</title>
            </head>
            <body>
              <noscript>Inmerson Math-CS requires JavaScript for its interactive mathematics laboratories.</noscript>
              <div id="root"></div>
              <script type="module" src="/index.tsx"></script>
            </body>
          </html>
          EOF

          cat > index.tsx <<'EOF'
          import React from 'react';
          import ReactDOM from 'react-dom/client';
          import App from './App';
          import './index.css';

          const rootElement = document.getElementById('root');
          if (!rootElement) throw new Error('Could not find the Math-CS root element');

          ReactDOM.createRoot(rootElement).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>,
          );
          EOF

          node - <<'NODE'
          const fs = require('fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const dependency of [
            '@google/genai',
            '@react-three/drei',
            '@react-three/fiber',
            'mathjs',
            'react-markdown',
            'three',
            'vite-plugin-pwa',
          ]) delete packageJson.dependencies[dependency];
          packageJson.scripts['check:domain'] = 'node scripts/check-domain-clean.mjs';
          packageJson.scripts.verify = 'npm run typecheck && npm test && npm run check:domain && npm run build';
          fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts

          cat > manifest.json <<'EOF'
          {
            "name": "Inmerson Math-CS • Interactive Mathematics for Computer Science",
            "short_name": "Math-CS",
            "description": "Interactive Mathematical Analysis and Linear Algebra & Geometry for computer science.",
            "start_url": "/Math-CS/",
            "scope": "/Math-CS/",
            "display": "standalone",
            "background_color": "#07111f",
            "theme_color": "#0f766e",
            "icons": []
          }
          EOF

          cat > metadata.json <<'EOF'
          {
            "name": "Inmerson Math-CS",
            "description": "Interactive Mathematics for Computer Science: Mathematical Analysis and Linear Algebra & Geometry.",
            "courses": ["Mathematical Analysis", "Linear Algebra & Geometry"]
          }
          EOF

          cat > render.yaml <<'EOF'
          services:
            - type: web
              name: inmerson-math-cs-api
              env: node
              rootDir: server
              buildCommand: npm ci && npm run build
              startCommand: npm start
          EOF
      - name: Rename Capacitor Android and server surfaces
        run: |
          set -euo pipefail
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.inmersion.mathcs',
            appName: 'Math-CS',
            webDir: 'dist',
          };

          export default config;
          EOF

          sed -i 's/com\.inmersion\.mathbiotech/com.inmersion.mathcs/g' android/app/build.gradle android/app/src/main/AndroidManifest.xml || true
          mkdir -p android/app/src/main/java/com/inmersion/mathcs
          if [ -f android/app/src/main/java/com/inmersion/mathbiotech/MainActivity.java ]; then
            mv android/app/src/main/java/com/inmersion/mathbiotech/MainActivity.java android/app/src/main/java/com/inmersion/mathcs/MainActivity.java
          fi
          rm -rf android/app/src/main/java/com/inmersion/mathbiotech
          cat > android/app/src/main/java/com/inmersion/mathcs/MainActivity.java <<'EOF'
          package com.inmersion.mathcs;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {}
          EOF

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Math-CS</string>
              <string name="title_activity_main">Inmerson Math-CS</string>
              <string name="package_name">com.inmersion.mathcs</string>
              <string name="custom_url_scheme">com.inmersion.mathcs</string>
          </resources>
          EOF

          cat > android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#07111F" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#67E8F9" android:strokeWidth="5" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="@android:color/transparent" android:pathData="M72,29H38L58,54L38,79H72M28,54H80"/>
          </vector>
          EOF

          cat > android/app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#07111F" /></shape>
          EOF
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#07111F</color></resources>
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib

          def png(width=512, height=512):
              rows=[]
              for y in range(height):
                  row=bytearray([0])
                  for x in range(width):
                      grid = x % 64 in (0,1) or y % 64 in (0,1)
                      axis = abs(x-width//2) < 3 or abs(y-height//2) < 3
                      if axis: color=(103,232,249,255)
                      elif grid: color=(24,55,76,255)
                      else: color=(7,17,31,255)
                      row.extend(color)
                  rows.append(bytes(row))
              raw=b''.join(rows)
              def chunk(kind,data):
                  return struct.pack('>I',len(data))+kind+data+struct.pack('>I',zlib.crc32(kind+data)&0xffffffff)
              return b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',width,height,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')

          payload=png()
          for path in Path('android/app/src/main/res').rglob('*.png'):
              path.write_bytes(payload)
          PY

          node - <<'NODE'
          const fs=require('fs');
          const path='server/package.json';
          const pkg=JSON.parse(fs.readFileSync(path,'utf8'));
          pkg.name='inmerson-math-cs-api';
          fs.writeFileSync(path,JSON.stringify(pkg,null,2)+'\n');
          NODE
          (cd server && npm install --package-lock-only --ignore-scripts)

          python3 - <<'PY'
          from pathlib import Path
          path=Path('server/src/index.ts')
          if path.exists():
              text=path.read_text()
              replacements={
                'Math Biotech API':'Math-CS API',
                'Math-Biotech API':'Math-CS API',
                'Inmerson Lab API':'Inmerson Math-CS API',
                'Math Biotech':'Math-CS',
                'Math-Biotech':'Math-CS',
              }
              for old,new in replacements.items(): text=text.replace(old,new)
              path.write_text(text)
          PY

          cat > server/README.md <<'EOF'
          # Inmerson Math-CS API

          Optional Node.js API services for deterministic matrix operations and assessment support used by Inmerson Math-CS.

          ```bash
          npm ci
          npm run build
          npm start
          ```

          The browser application remains usable without this optional service; learner progress stays local to the device.
          EOF
          cat > server/QUICKSTART.md <<'EOF'
          # Math-CS API Quick Start

          From the `server` directory run `npm ci`, then `npm run build` and `npm start`. Configure allowed origins through environment variables before public deployment.
          EOF
      - name: Add learner-facing domain cleanliness gate
        run: |
          set -euo pipefail
          mkdir -p scripts
          cat > scripts/check-domain-clean.mjs <<'EOF'
          import { readdir, readFile, stat } from 'node:fs/promises';
          import { extname, join, relative } from 'node:path';

          const root = process.cwd();
          const roots = [
            'App.tsx', 'components', 'data', 'domain', 'services', 'utils', 'views',
            'android', 'server', 'index.html', 'index.tsx', 'manifest.json',
            'metadata.json', 'README.md', 'capacitor.config.ts', 'render.yaml', 'site',
          ];
          const textExtensions = new Set(['.ts','.tsx','.js','.jsx','.mjs','.json','.md','.html','.xml','.gradle','.yaml','.yml','.properties']);
          const forbidden = [
            ['bio','tech'].join(''),
            ['bio','technology'].join(''),
            ['bio','logy'].join(''),
            ['d','n','a'].join(''),
            ['population','model'].join(' '),
            ['radioactive','decay'].join(' '),
            ['differential','equation'].join(' '),
            ['math','biotech'].join('-'),
            ['s','g','g','w'].join(''),
            ['Warsaw University','of Life Sciences'].join(' '),
          ].map((value) => new RegExp(value, 'i'));
          const matches=[];

          async function inspect(path) {
            let info;
            try { info=await stat(path); } catch { return; }
            if (info.isDirectory()) {
              for (const entry of await readdir(path)) {
                if (['node_modules','dist','.git'].includes(entry)) continue;
                await inspect(join(path,entry));
              }
              return;
            }
            if (!textExtensions.has(extname(path)) && !['Dockerfile'].includes(path.split('/').at(-1))) return;
            const content=await readFile(path,'utf8');
            content.split(/\r?\n/).forEach((line,index) => {
              if (forbidden.some((pattern) => pattern.test(line))) matches.push(`${relative(root,path)}:${index+1}: ${line.trim()}`);
            });
          }

          for (const item of roots) await inspect(join(root,item));
          if (matches.length) {
            console.error('Learner-facing legacy-domain references remain:\n'+matches.join('\n'));
            process.exit(1);
          }
          console.log('Math-CS learner-facing domain scan passed.');
          EOF

          cat > scripts/check-domain-clean.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { readFileSync } from 'node:fs';
          describe('domain cleanliness gate',()=>{it('constructs forbidden terms without embedding them literally in the scanner',()=>{const source=readFileSync('scripts/check-domain-clean.mjs','utf8');expect(source).toContain("['bio','tech'].join('')");expect(source).toContain("['d','n','a'].join('')");});});
          EOF

          cat > README.md <<'EOF'
          # Inmerson Math-CS

          **Interactive Mathematics for Computer Science**

          Inmerson Math-CS is a Computational Notebook-style learning workspace for the first two mathematics courses in the PJATK Computer Science sequence:

          - **Math I — Mathematical Analysis / Analiza matematyczna:** functions, sequences, limits, continuity, derivatives, applications of derivatives, integrals, and Taylor polynomials and series.
          - **Math II — Linear Algebra & Geometry / Algebra liniowa i geometria:** vectors, matrices, linear systems, determinants, inverses, vector spaces, linear transformations, eigenvalues and eigenvectors, and analytic geometry in two and three dimensions.

          ## Learning experience

          Each topic follows **Learn → Visualize → Practice → CS Connection → Quiz**. Function Explorer, Matrix Lab, and Vector & Geometry Lab use bounded curriculum presets and deterministic calculations. Progress, quiz results, saved formulas, and notes remain local to the device under versioned `math-cs:v1:` storage keys.

          ## Development

          ```bash
          npm ci --include=optional
          npm run dev
          ```

          Run the complete quality gate:

          ```bash
          npm run verify
          ```

          Build the GitHub Pages output under `site/`:

          ```bash
          npm run build:pages
          ```

          The application uses React, TypeScript, Vite, Vitest, Testing Library, Tailwind CSS, Framer Motion, KaTeX, Lucide, and Capacitor.
          EOF
      - name: Verify regenerate release and commit
        run: |
          set -euo pipefail
          npm run verify
          npm run build:pages
          npm run check:domain
          test -f site/index.html
          grep -q 'Inmerson Math-CS' site/index.html
          if grep -RniE 'bio.?tech|population model|radioactive decay|differential equation|math.?biotech|SGGW|Warsaw University of Life Sciences' site; then
            echo 'Legacy domain text found in generated release'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize Math-CS platform and domain cleanup"
          git push origin feat/math-cs-conversion
