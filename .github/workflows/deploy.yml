name: Publish GitHub Pages site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: math-cs-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Verify and publish static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Verify application
        run: npm run verify

      - name: Build GitHub Pages site
        run: npm run build:pages

      - name: Verify generated site
        run: |
          test -f site/index.html
          grep -q 'Inmerson Math-CS' site/index.html
          if grep -RniE 'bio.?tech|population model|radioactive decay|differential equation|math.?biotech|SGGW|Warsaw University of Life Sciences' site; then
            echo 'Legacy domain text found in generated release'
            exit 1
          fi

      - name: Publish gh-pages branch
        run: |
          set -euo pipefail
          rm -rf /tmp/math-cs-pages
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add --force /tmp/math-cs-pages origin/gh-pages
          find /tmp/math-cs-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a site/. /tmp/math-cs-pages/
          cp manifest.json /tmp/math-cs-pages/manifest.json
          touch /tmp/math-cs-pages/.nojekyll
          cd /tmp/math-cs-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Published Math-CS site is already current."
          else
            git commit -m "deploy: publish Math-CS site"
            git push origin HEAD:gh-pages
          fi
