name: Cosmic Design CI

on:
  push:
    branches: [design/cosmic-black-hole-ui]

permissions:
  contents: read

concurrency:
  group: cosmic-design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify cosmic design branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=optional
      - name: Run application verification
        run: npm run verify
      - name: Build GitHub Pages output
        run: npm run build:pages
