name: Finalize deterministic Math-CS release

on:
  push:
    branches: [main]
    paths: [.github/workflows/execute-batch-5-fix2.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/math-cs-conversion
          fetch-depth: 0
      - name: Regenerate cleanup write scanner verify and commit
        run: |
          set -euo pipefail
          curl -L --fail https://raw.githubusercontent.com/Inmerson/Math-CS/main/.github/workflows/execute-batch-5.yml -o /tmp/batch.yml
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/batch.yml').read_text().splitlines(); scripts=[]; i=0
          while i<len(lines):
              if lines[i]=='        run: |':
                  i+=1; block=[]
                  while i<len(lines):
                      line=lines[i]
                      if line and len(line)-len(line.lstrip(' '))<=8: break
                      block.append(line[10:] if line.startswith('          ') else ''); i+=1
                  scripts.append('\n'.join(block).rstrip()+'\n'); continue
              i+=1
          if len(scripts)!=6: raise SystemExit(f'Expected 6 run blocks, found {len(scripts)}')
          for n,script in enumerate(scripts,1):
              p=Path(f'/tmp/cleanup-step-{n}.sh'); p.write_text('#!/usr/bin/env bash\n'+script); p.chmod(0o755)
          PY
          for number in 1 2 3 4 5; do /tmp/cleanup-step-${number}.sh; done

          cat > scripts/check-domain-clean.mjs <<'EOF'
          import { readdir, readFile, stat } from 'node:fs/promises';
          import { extname, join, relative } from 'node:path';

          const root = process.cwd();
          const roots = [
            'App.tsx', 'components', 'data', 'domain', 'services', 'utils', 'views',
            'android', 'server', 'index.html', 'index.tsx', 'manifest.json',
            'metadata.json', 'README.md', 'capacitor.config.ts', 'render.yaml', 'site',
          ];
          const textExtensions = new Set(['.ts','.tsx','.js','.jsx','.mjs','.json','.md','.html','.xml','.gradle','.yaml','.yml','.properties']);
          const forbidden = [
            ['bio','tech'].join(''),
            ['bio','technology'].join(''),
            ['bio','logy'].join(''),
            ['d','n','a'].join(''),
            ['population','model'].join(' '),
            ['radioactive','decay'].join(' '),
            ['differential','equation'].join(' '),
            ['math','biotech'].join('-'),
            ['s','g','g','w'].join(''),
            ['Warsaw University','of Life Sciences'].join(' '),
          ].map((value) => new RegExp(value, 'i'));
          const matches=[];

          async function inspect(path) {
            let info;
            try { info=await stat(path); } catch { return; }
            if (info.isDirectory()) {
              for (const entry of await readdir(path)) {
                if (['node_modules','dist','.git'].includes(entry)) continue;
                await inspect(join(path,entry));
              }
              return;
            }
            const relativePath=relative(root,path);
            if (relativePath.includes('/__tests__/') || /\.test\.[^.]+$/.test(relativePath)) return;
            if (!textExtensions.has(extname(path)) && path.split('/').at(-1) !== 'Dockerfile') return;
            const content=await readFile(path,'utf8');
            content.split(/\r?\n/).forEach((line,index) => {
              if (forbidden.some((pattern) => pattern.test(line))) matches.push(`${relativePath}:${index+1}: ${line.trim()}`);
            });
          }

          for (const item of roots) await inspect(join(root,item));
          if (matches.length) {
            console.error('Learner-facing legacy-domain references remain:\n'+matches.join('\n'));
            process.exit(1);
          }
          console.log('Math-CS learner-facing domain scan passed.');
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import json
          package=Path('server/package.json')
          data=json.loads(package.read_text())
          data['description']='Optional API for deterministic Math-CS matrix and assessment services'
          package.write_text(json.dumps(data,indent=2)+'\n')
          index=Path('server/src/index.ts')
          if index.exists():
              source=index.read_text()
              for old in ['Backend API for Inmerson Personal Math & Biotech Lab','Backend API for Math Biotech Project']:
                  source=source.replace(old,'Optional API for deterministic Inmerson Math-CS services')
              index.write_text(source)
          test_api=Path('server/test-api.js')
          if test_api.exists():
              source=test_api.read_text().replace('Simple test script for Math Biotech API','Simple test script for Math-CS API').replace('Math Biotech API Test Suite','Math-CS API Test Suite')
              test_api.write_text(source)
          PY
          (cd server && npm install --package-lock-only --ignore-scripts)
          /tmp/cleanup-step-6.sh
