      - name: Connect learning tools to App and lesson flow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          learning=Path('components/course/LearningFlow.tsx').read_text()
          learning=learning.replace("import { MathRenderer } from '../MathRenderer';", "import { MathRenderer } from '../MathRenderer';\nimport { QuizRunner, QuizSubmission } from '../quiz/QuizRunner';")
          learning=learning.replace("interface LearningFlowProps { topic: TopicDefinition; onOpenLab: () => void; }", "interface LearningFlowProps { topic: TopicDefinition; onOpenLab: () => void; onQuizComplete: (result: QuizSubmission) => void; }")
          learning=learning.replace("export const LearningFlow: React.FC<LearningFlowProps> = ({ topic, onOpenLab }) => (", "export const LearningFlow: React.FC<LearningFlowProps> = ({ topic, onOpenLab, onQuizComplete }) => (")
          old='<section className="notebook-panel p-5" aria-labelledby="stage-quiz"><h2 id="stage-quiz" className="stage-title"><Trophy />{stages[4]}</h2><p className="mt-3 font-medium text-white">{topic.quiz.title}</p><p className="mt-1 text-sm text-slate-400">{topic.quiz.questions.length} questions. Quiz runner activates in the assessment stage.</p><button className="mt-4 cursor-not-allowed rounded-lg border border-white/10 px-4 py-2 text-sm text-slate-500" disabled>Start checkpoint</button></section>'
          new='<section className="notebook-panel p-5" aria-labelledby="stage-quiz"><h2 id="stage-quiz" className="stage-title"><Trophy />{stages[4]}</h2><div className="mt-4"><QuizRunner courseId={topic.courseId} topicId={topic.id} quiz={topic.quiz} onComplete={onQuizComplete} /></div></section>'
          if old not in learning: raise SystemExit('LearningFlow quiz block not found')
          Path('components/course/LearningFlow.tsx').write_text(learning.replace(old,new))

          lesson=Path('views/LessonWorkspaceView.tsx').read_text()
          lesson=lesson.replace("import { LearningFlow } from '../components/course/LearningFlow';", "import { LearningFlow } from '../components/course/LearningFlow';\nimport { QuizSubmission } from '../components/quiz/QuizRunner';")
          lesson=lesson.replace("interface LessonWorkspaceViewProps { courseId: CourseId; topicId: TopicId; state: MathCsState; onNavigate: (destination: AppDestination) => void; onComplete: (topicId: TopicId) => void; }", "interface LessonWorkspaceViewProps { courseId: CourseId; topicId: TopicId; state: MathCsState; onNavigate: (destination: AppDestination) => void; onComplete: (topicId: TopicId) => void; onQuizComplete: (result: QuizSubmission) => void; }")
          lesson=lesson.replace("export const LessonWorkspaceView: React.FC<LessonWorkspaceViewProps> = ({ courseId, topicId, state, onNavigate, onComplete }) => {", "export const LessonWorkspaceView: React.FC<LessonWorkspaceViewProps> = ({ courseId, topicId, state, onNavigate, onComplete, onQuizComplete }) => {")
          lesson=lesson.replace('<LearningFlow topic={topic} onOpenLab={() => onNavigate({ section: \'math-lab\', courseId, topicId, labId })} />','<LearningFlow topic={topic} onOpenLab={() => onNavigate({ section: \'math-lab\', courseId, topicId, labId })} onQuizComplete={onQuizComplete} />')
          Path('views/LessonWorkspaceView.tsx').write_text(lesson)

          app=Path('App.tsx').read_text()
          app=app.replace("import { MathLabView } from './views/MathLabView';", "import { MathLabView } from './views/MathLabView';\nimport { PracticeView } from './views/PracticeView';\nimport { ExamsView } from './views/ExamsView';\nimport { ProgressView } from './views/ProgressView';\nimport { FormulaWorkspaceView } from './views/FormulaWorkspaceView';\nimport { AIChatView } from './views/AIChatView';\nimport { QuizSubmission } from './components/quiz/QuizRunner';")
          app=app.replace("import { markTopicComplete } from './utils/progress';", "import { markTopicComplete, recordQuizResult, removeFormula, saveFormula, saveFormulaNote } from './utils/progress';")
          app=app.replace("  const renderContent = () => {", "  const handleQuiz = (result: QuizSubmission) => {\n    const withResult = recordQuizResult(state, result.courseId, result.topicId, result.score, result.total);\n    updateState(result.percentage >= 70 ? markTopicComplete(withResult, result.topicId) : withResult);\n  };\n\n  const renderContent = () => {")
          app=app.replace("case 'lesson': return <LessonWorkspaceView courseId={destination.courseId!} topicId={destination.topicId!} state={state} onNavigate={navigate} onComplete={(topicId) => updateState(markTopicComplete(state, topicId))} />;", "case 'lesson': return <LessonWorkspaceView courseId={destination.courseId!} topicId={destination.topicId!} state={state} onNavigate={navigate} onComplete={(topicId) => updateState(markTopicComplete(state, topicId))} onQuizComplete={handleQuiz} />;")
          app=app.replace("case 'practice': return <Placeholder title=\"Practice\" description=\"Topic-filtered guided practice will use the same deterministic curriculum question bank.\" />;", "case 'practice': return <PracticeView onComplete={handleQuiz} />;")
          app=app.replace("case 'exams': return <Placeholder title=\"Exams\" description=\"Course checkpoints and mock examinations will report results by topic.\" />;", "case 'exams': return <ExamsView onComplete={handleQuiz} />;")
          app=app.replace("case 'progress': return <Placeholder title=\"Progress\" description=\"Completion, mastery, and review recommendations remain local to this device.\" />;", "case 'progress': return <ProgressView state={state} />;")
          app=app.replace("case 'formulas': return <Placeholder title=\"Formula Workspace\" description=\"Saved formulas and personal notes will appear here.\" />;", "case 'formulas': return <FormulaWorkspaceView state={state} onSave={(formula) => updateState(saveFormula(state, formula))} onRemove={(id) => updateState(removeFormula(state, id))} onNote={(id, note) => updateState(saveFormulaNote(state, id, note))} />;")
          app=app.replace("case 'assistant': return <Placeholder title=\"Math Assistant\" description=\"The contextual assistant will provide bounded, stepwise hints for the active topic.\" />;", "case 'assistant': return <AIChatView context={destination} onNavigate={navigate} />;")
          app=app.replace("\nconst Placeholder: React.FC<{ title: string; description: string }> = ({ title, description }) => <div className=\"mx-auto max-w-4xl\"><h1 className=\"text-3xl font-bold text-white\">{title}</h1><div className=\"notebook-panel mt-5 p-6\"><p className=\"leading-7 text-slate-300\">{description}</p></div></div>;\n", "\n")
          Path('App.tsx').write_text(app)
          PY

          python3 - <<'PY'
          from pathlib import Path
          for path in ['views/LessonWorkspaceView.test.tsx']:
              text=Path(path).read_text()
              text=text.replace('onComplete={vi.fn()} />','onComplete={vi.fn()} onQuizComplete={vi.fn()} />')
              Path(path).write_text(text)
          PY

