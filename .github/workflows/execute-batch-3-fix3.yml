name: Complete typed Math-CS laboratories

on:
  push:
    branches: [main]
    paths: [.github/workflows/execute-batch-3-fix3.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout conversion branch
        uses: actions/checkout@v4
        with:
          ref: feat/math-cs-conversion
          fetch-depth: 0
      - name: Install dependencies
        run: |
          npm cache clean --force
          npm ci --include=optional
      - name: Generate, correct, verify, and commit labs
        run: |
          set -euo pipefail
          curl -L --fail https://raw.githubusercontent.com/Inmerson/Math-CS/main/.github/workflows/execute-batch-3.yml -o /tmp/batch.yml
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/batch.yml').read_text().splitlines(); scripts=[]; i=0
          while i<len(lines):
              if lines[i]=='        run: |':
                  i+=1; block=[]
                  while i<len(lines):
                      line=lines[i]
                      if line and len(line)-len(line.lstrip(' '))<=8: break
                      block.append(line[10:] if line.startswith('          ') else ''); i+=1
                  script='\n'.join(block).rstrip()+'\n'
                  script=script.replace('className="mt-2 w-full accent-cyan-300" type="range"','aria-label={parameter.label} className="mt-2 w-full accent-cyan-300" type="range"')
                  script=script.replace("if (!length.ok) return length;", "if (!length.ok) return { ok: false, error: length.error };")
                  script=script.replace("if(!A.ok)return A.error;", "if(A.ok === false)return A.error;")
                  script=script.replace("if(!B.ok)return B.error;", "if(B.ok === false)return B.error;")
                  scripts.append(script); continue
              i+=1
          if len(scripts)!=4: raise SystemExit(f'Expected 4 run blocks, found {len(scripts)}')
          for n,script in enumerate(scripts,1):
              p=Path(f'/tmp/step-{n}.sh'); p.write_text('#!/usr/bin/env bash\n'+script); p.chmod(0o755)
          PY
          for script in /tmp/step-*.sh; do "$script"; done
