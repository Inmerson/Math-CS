name: Execute Math-CS foundation batch

on:
  push:
    branches: [main]
    paths: [.github/workflows/execute-batch-1.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout conversion branch
        uses: actions/checkout@v4
        with:
          ref: feat/math-cs-conversion
          fetch-depth: 0

      - name: Verify imported baseline
        run: |
          set -euo pipefail
          npm ci --include=optional
          npm run verify

      - name: Add approved plan and product identity
        run: |
          set -euo pipefail
          mkdir -p docs/superpowers/plans
          curl -L --fail \
            https://raw.githubusercontent.com/Inmerson/Math-Biotech-Project/plan/math-cs-implementation/docs/superpowers/plans/2026-08-06-math-cs.md \
            -o docs/superpowers/plans/2026-08-06-math-cs.md
          curl -L --fail \
            https://raw.githubusercontent.com/Inmerson/Math-Biotech-Project/plan/math-cs-implementation/docs/superpowers/plans/2026-08-06-math-cs-review-notes.md \
            -o docs/superpowers/plans/2026-08-06-math-cs-review-notes.md

          cat > data/branding.ts <<'EOF'
          export const BRAND_NAME = 'Inmerson Math-CS';
          export const BRAND_TAGLINE = 'Interactive Mathematics for Computer Science';
          export const BRAND_FULL_NAME = `${BRAND_NAME} • ${BRAND_TAGLINE}`;
          export const BRAND_SHORT_NAME = 'Math-CS';
          export const BRAND_DESCRIPTION = 'A focused interactive workspace for Mathematical Analysis and Linear Algebra & Geometry in computer science.';
          EOF

          cat > data/branding.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import {
            BRAND_DESCRIPTION,
            BRAND_FULL_NAME,
            BRAND_NAME,
            BRAND_SHORT_NAME,
            BRAND_TAGLINE,
          } from './branding';

          describe('Math-CS branding', () => {
            it('uses the approved identity', () => {
              expect(BRAND_NAME).toBe('Inmerson Math-CS');
              expect(BRAND_TAGLINE).toBe('Interactive Mathematics for Computer Science');
              expect(BRAND_FULL_NAME).toBe('Inmerson Math-CS • Interactive Mathematics for Computer Science');
              expect(BRAND_SHORT_NAME).toBe('Math-CS');
              expect(BRAND_DESCRIPTION).toContain('Mathematical Analysis');
              expect(BRAND_DESCRIPTION).toContain('Linear Algebra');
              expect(BRAND_DESCRIPTION).not.toMatch(/biotech|biology|DNA/i);
            });
          });
          EOF

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['name'] = 'inmerson-math-cs'
          package['scripts']['build:pages'] = 'vite build --base=/Math-CS/ --outDir site --emptyOutDir'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          vite = Path('vite.config.ts').read_text()
          vite = re.sub(r"base:\s*'/Math-Biotech-Project/'", "base: '/Math-CS/'", vite)
          Path('vite.config.ts').write_text(vite)

          html = Path('index.html').read_text()
          html = html.replace('Inmerson • Personal Math & Biotech Lab', 'Inmerson Math-CS • Interactive Mathematics for Computer Science')
          html = html.replace('Personal Math & Biotech Lab', 'Interactive Mathematics for Computer Science')
          html = html.replace('Math-Biotech-Project', 'Math-CS')
          html = re.sub(r'<title>.*?</title>', '<title>Inmerson Math-CS • Interactive Mathematics for Computer Science</title>', html, flags=re.S)
          Path('index.html').write_text(html)

          Path('manifest.json').write_text(json.dumps({
            'name': 'Inmerson Math-CS • Interactive Mathematics for Computer Science',
            'short_name': 'Math-CS',
            'description': 'Interactive Mathematical Analysis and Linear Algebra & Geometry for computer science.',
            'start_url': '/Math-CS/',
            'display': 'standalone',
            'background_color': '#07111f',
            'theme_color': '#0f766e',
            'icons': []
          }, indent=2) + '\n')

          Path('metadata.json').write_text(json.dumps({
            'name': 'Inmerson Math-CS',
            'description': 'Interactive Mathematics for Computer Science: Mathematical Analysis and Linear Algebra & Geometry.'
          }, indent=2) + '\n')

          Path('.pages-release').write_text('Generated GitHub Pages output for Inmerson/Math-CS from main.\n')
          PY

          cat > README.md <<'EOF'
          # Inmerson Math-CS

          **Interactive Mathematics for Computer Science**

          A Computational Notebook-style learning workspace aligned with the first mathematics sequence in PJATK Computer Science:

          - **Math I — Mathematical Analysis:** functions, sequences, limits, continuity, derivatives, integrals, and Taylor series.
          - **Math II — Linear Algebra & Geometry:** vectors, matrices, linear systems, determinants, inverses, vector spaces, transformations, eigenvalues, and analytic geometry.

          The application combines concise theory, KaTeX formulas, worked examples, computer-science connections, bounded interactive laboratories, deterministic practice, mock exams, and local progress tracking. The three principal laboratories are Function Explorer, Matrix Lab, and Vector & Geometry Lab.

          ## Development

          ```bash
          npm ci --include=optional
          npm run dev
          ```

          Run the complete quality gate with:

          ```bash
          npm run verify
          ```

          The application uses React, TypeScript, Vite, Vitest, Tailwind CSS, Framer Motion, KaTeX, Math.js, React Three Fiber, and Capacitor.
          EOF

          npm install --package-lock-only --ignore-scripts

      - name: Add typed two-course curriculum
        run: |
          set -euo pipefail
          mkdir -p domain data/courses
          cat > domain/curriculum.ts <<'EOF'
          export type CourseId = 'math-analysis' | 'linear-algebra-geometry';
          export type TopicId =
            | 'functions-graphs'
            | 'sequences'
            | 'limits'
            | 'continuity'
            | 'derivatives'
            | 'derivative-applications'
            | 'integrals'
            | 'taylor-series'
            | 'vectors'
            | 'matrices'
            | 'linear-systems'
            | 'determinants'
            | 'matrix-inverses'
            | 'vector-spaces'
            | 'linear-transformations'
            | 'eigenvalues-eigenvectors'
            | 'analytic-geometry';

          export type LearningStage = 'learn' | 'visualize' | 'practice' | 'cs-connection' | 'quiz';
          export type VisualizationKind = 'function-explorer' | 'matrix-lab' | 'vector-geometry-lab' | 'none';
          export type QuestionKind = 'multiple-choice' | 'numeric' | 'ordered-steps' | 'matrix' | 'vector';

          export interface FormulaDefinition {
            id: string;
            label: string;
            latex: string;
            explanation: string;
          }

          export interface PracticeQuestion {
            id: string;
            kind: QuestionKind;
            prompt: string;
            choices?: string[];
            answer: string | number | number[] | number[][];
            tolerance?: number;
            explanation: string;
          }

          export interface QuizDefinition {
            id: string;
            title: string;
            questions: PracticeQuestion[];
          }

          export interface TopicDefinition {
            id: TopicId;
            courseId: CourseId;
            title: string;
            description: string;
            prerequisites: TopicId[];
            learningObjectives: string[];
            sections: { id: string; title: string; markdown: string }[];
            formulas: FormulaDefinition[];
            visualization: { kind: VisualizationKind; presetId?: string };
            workedExamples: { id: string; title: string; steps: string[] }[];
            csConnections: { title: string; explanation: string }[];
            practiceQuestions: PracticeQuestion[];
            quiz: QuizDefinition;
            difficulty: 1 | 2 | 3;
            estimatedStudyMinutes: number;
          }

          export interface CourseDefinition {
            id: CourseId;
            title: string;
            officialTitle: string;
            shortTitle: 'Math I' | 'Math II';
            description: string;
            order: 1 | 2;
            topics: TopicDefinition[];
          }
          EOF

          cat > data/courses/topicFactory.ts <<'EOF'
          import {
            CourseId,
            TopicDefinition,
            TopicId,
            VisualizationKind,
          } from '../../domain/curriculum';

          interface TopicSeed {
            id: TopicId;
            courseId: CourseId;
            title: string;
            description: string;
            prerequisites?: TopicId[];
            objective: string;
            theory: string;
            formulaLabel: string;
            formulaLatex: string;
            formulaExplanation: string;
            visualization: VisualizationKind;
            example: string[];
            csTitle: string;
            csExplanation: string;
            checkPrompt: string;
            checkAnswer: string;
            numericPrompt: string;
            numericAnswer: number;
            difficulty?: 1 | 2 | 3;
          }

          export const createTopic = (seed: TopicSeed): TopicDefinition => {
            const practiceQuestions = [
              {
                id: `${seed.id}-concept`,
                kind: 'multiple-choice' as const,
                prompt: seed.checkPrompt,
                choices: [seed.checkAnswer, 'None of these', 'The expression is undefined', 'Only by numerical simulation'],
                answer: seed.checkAnswer,
                explanation: `The defining idea is: ${seed.checkAnswer}.`,
              },
              {
                id: `${seed.id}-numeric`,
                kind: 'numeric' as const,
                prompt: seed.numericPrompt,
                answer: seed.numericAnswer,
                tolerance: 0.001,
                explanation: `The expected numerical result is ${seed.numericAnswer}.`,
              },
            ];

            return {
              id: seed.id,
              courseId: seed.courseId,
              title: seed.title,
              description: seed.description,
              prerequisites: seed.prerequisites ?? [],
              learningObjectives: [seed.objective],
              sections: [{ id: `${seed.id}-theory`, title: 'Core idea', markdown: seed.theory }],
              formulas: [{
                id: `${seed.id}-formula`,
                label: seed.formulaLabel,
                latex: seed.formulaLatex,
                explanation: seed.formulaExplanation,
              }],
              visualization: { kind: seed.visualization, presetId: seed.id },
              workedExamples: [{ id: `${seed.id}-example`, title: 'Worked example', steps: seed.example }],
              csConnections: [{ title: seed.csTitle, explanation: seed.csExplanation }],
              practiceQuestions,
              quiz: {
                id: `${seed.id}-quiz`,
                title: `${seed.title} checkpoint`,
                questions: [
                  ...practiceQuestions,
                  {
                    id: `${seed.id}-reflection`,
                    kind: 'multiple-choice',
                    prompt: `Which statement best summarizes ${seed.title}?`,
                    choices: [seed.description, 'It is unrelated to computation', 'It applies only to biology', 'It is a discrete mathematics topic'],
                    answer: seed.description,
                    explanation: seed.description,
                  },
                ],
              },
              difficulty: seed.difficulty ?? 2,
              estimatedStudyMinutes: 45,
            };
          };
          EOF

