          cat > utils/mathCsStorage.ts <<'EOF'
          import { CourseId, TopicId } from '../domain/curriculum';

          export const MATH_CS_STORAGE_PREFIX = 'math-cs:v1:';
          const STATE_KEY = `${MATH_CS_STORAGE_PREFIX}state`;

          export interface QuizResult {
            courseId: CourseId;
            topicId: TopicId;
            score: number;
            total: number;
            percentage: number;
            completedAt: string;
          }

          export interface SavedFormula {
            formulaId: string;
            courseId: CourseId;
            topicId: TopicId;
            note: string;
          }

          export interface MathCsState {
            version: 1;
            completedTopicIds: TopicId[];
            lastDestination: { section: string; courseId?: CourseId; topicId?: TopicId } | null;
            quizResults: QuizResult[];
            savedFormulas: SavedFormula[];
          }

          export const createDefaultMathCsState = (): MathCsState => ({
            version: 1,
            completedTopicIds: [],
            lastDestination: null,
            quizResults: [],
            savedFormulas: [],
          });

          const normalizeState = (value: unknown): MathCsState => {
            if (!value || typeof value !== 'object') return createDefaultMathCsState();
            const candidate = value as Partial<MathCsState>;
            if (candidate.version !== 1) return createDefaultMathCsState();
            return {
              version: 1,
              completedTopicIds: [...new Set(Array.isArray(candidate.completedTopicIds) ? candidate.completedTopicIds : [])],
              lastDestination: candidate.lastDestination && typeof candidate.lastDestination.section === 'string'
                ? candidate.lastDestination
                : null,
              quizResults: Array.isArray(candidate.quizResults) ? candidate.quizResults.filter((item): item is QuizResult => Boolean(item && item.courseId && item.topicId)) : [],
              savedFormulas: Array.isArray(candidate.savedFormulas)
                ? Array.from(new Map(candidate.savedFormulas.filter(Boolean).map((item) => [item.formulaId, item])).values())
                : [],
            };
          };

          export const loadMathCsState = (): MathCsState => {
            if (typeof localStorage === 'undefined') return createDefaultMathCsState();
            try {
              const raw = localStorage.getItem(STATE_KEY);
              return raw ? normalizeState(JSON.parse(raw)) : createDefaultMathCsState();
            } catch {
              return createDefaultMathCsState();
            }
          };

          export const saveMathCsState = (state: MathCsState): void => {
            if (typeof localStorage === 'undefined') return;
            localStorage.setItem(STATE_KEY, JSON.stringify(normalizeState(state)));
          };

          export const clearMathCsState = (): void => {
            if (typeof localStorage === 'undefined') return;
            localStorage.removeItem(STATE_KEY);
          };
          EOF

          cat > utils/progress.ts <<'EOF'
          import { CourseDefinition, CourseId, TopicId } from '../domain/curriculum';
          import { MathCsState, SavedFormula } from './mathCsStorage';

          export const markTopicComplete = (state: MathCsState, topicId: TopicId): MathCsState => ({
            ...state,
            completedTopicIds: [...new Set([...state.completedTopicIds, topicId])],
          });

          export const recordQuizResult = (
            state: MathCsState,
            courseId: CourseId,
            topicId: TopicId,
            score: number,
            total: number,
            completedAt = new Date().toISOString(),
          ): MathCsState => {
            const percentage = total > 0 ? Math.round((score / total) * 100) : 0;
            const existing = state.quizResults.find((result) => result.courseId === courseId && result.topicId === topicId);
            const best = existing && existing.percentage > percentage
              ? { ...existing, completedAt }
              : { courseId, topicId, score, total, percentage, completedAt };
            return {
              ...state,
              quizResults: [
                ...state.quizResults.filter((result) => result.courseId !== courseId || result.topicId !== topicId),
                best,
              ],
            };
          };

          export const saveFormula = (state: MathCsState, formula: SavedFormula): MathCsState => ({
            ...state,
            savedFormulas: [
              ...state.savedFormulas.filter((item) => item.formulaId !== formula.formulaId),
              formula,
            ],
          });

          export const removeFormula = (state: MathCsState, formulaId: string): MathCsState => ({
            ...state,
            savedFormulas: state.savedFormulas.filter((formula) => formula.formulaId !== formulaId),
          });

          export const saveFormulaNote = (state: MathCsState, formulaId: string, note: string): MathCsState => ({
            ...state,
            savedFormulas: state.savedFormulas.map((formula) => formula.formulaId === formulaId ? { ...formula, note } : formula),
          });

          export const getCourseProgress = (state: MathCsState, course: CourseDefinition): number => {
            if (course.topics.length === 0) return 0;
            const completed = course.topics.filter((topic) => state.completedTopicIds.includes(topic.id)).length;
            return Math.round((completed / course.topics.length) * 100);
          };

          export const getRecommendedTopic = (state: MathCsState, course: CourseDefinition) =>
            course.topics.find((topic) => !state.completedTopicIds.includes(topic.id)
              && topic.prerequisites.every((prerequisite) => state.completedTopicIds.includes(prerequisite)))
            ?? course.topics.find((topic) => !state.completedTopicIds.includes(topic.id));
          EOF

          cat > utils/mathCsStorage.test.ts <<'EOF'
