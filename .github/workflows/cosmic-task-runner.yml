name: Cosmic Task Runner

on:
  push:
    branches: [design/cosmic-black-hole-ui]

permissions:
  contents: write

concurrency:
  group: cosmic-task-runner
  cancel-in-progress: false

jobs:
  execute:
    if: startsWith(github.event.head_commit.message, 'chore(sdd):')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: design/cosmic-black-hole-ui
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=optional
      - name: Execute task
        run: bash .github/sdd/current-task.sh
      - name: Commit verified task result
        run: |
          message=$(cat .github/sdd/commit-message.txt)
          rm -f .github/sdd/current-task.sh .github/sdd/commit-message.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$message"
          git push origin HEAD:design/cosmic-black-hole-ui
