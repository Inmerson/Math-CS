name: Finalize typed Math-CS learning tools

on:
  push:
    branches: [main]
    paths: [.github/workflows/execute-batch-4-fix2.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/math-cs-conversion
          fetch-depth: 0
      - name: Generate correct and verify learning tools
        run: |
          set -euo pipefail
          curl -L --fail https://raw.githubusercontent.com/Inmerson/Math-CS/main/.github/workflows/execute-batch-4.yml -o /tmp/batch.yml
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/batch.yml').read_text().splitlines()
          scripts=[]; i=0
          while i < len(lines):
              if lines[i] == '        run: |':
                  i += 1; block=[]
                  while i < len(lines):
                      line=lines[i]
                      if line and len(line)-len(line.lstrip(' ')) <= 8: break
                      block.append(line[10:] if line.startswith('          ') else '')
                      i += 1
                  script='\n'.join(block).rstrip()+'\n'
                  script=script.replace(
                    "const close = (a: number, b: number, tolerance: number) => Math.abs(a - b) <= tolerance;",
                    "const close = (a: number, b: number, tolerance: number) => Math.abs(a - b) <= tolerance + Number.EPSILON * 10;",
                  )
                  script=script.replace(
                    "expect(screen.getByText(/Mathematical Analysis and Linear Algebra & Geometry/)).toBeInTheDocument();",
                    "expect(screen.getAllByText(/Mathematical Analysis and Linear Algebra & Geometry/).length).toBeGreaterThan(0);",
                  )
                  scripts.append(script); continue
              i += 1
          if len(scripts) != 6: raise SystemExit(f'Expected 6 run blocks, found {len(scripts)}')
          for n,script in enumerate(scripts,1):
              p=Path(f'/tmp/step-{n}.sh'); p.write_text('#!/usr/bin/env bash\n'+script); p.chmod(0o755)
          PY
          npm cache clean --force
          for number in 1 2 3 4 5; do /tmp/step-${number}.sh; done
          python3 - <<'PY'
          from pathlib import Path
          path=Path('domain/curriculum.ts')
          text=path.read_text()
          old='answer: string | number | number[] | number[][];'
          new='answer: string | number | string[] | number[] | number[][];'
          if old not in text: raise SystemExit('PracticeQuestion answer union not found')
          path.write_text(text.replace(old,new))
          PY
          /tmp/step-6.sh
