name: Verify final Math-CS feature branch

on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-feature-final.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-feature:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout final feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/math-cs-conversion

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci --include=optional

      - name: Verify web application
        run: npm run verify

      - name: Rebuild Pages release
        run: npm run build:pages

      - name: Verify generated release
        run: |
          test -f site/index.html
          grep -q 'Inmerson Math-CS' site/index.html
          npm run check:domain
          if grep -RniE 'bio.?tech|population model|radioactive decay|differential equation|math.?biotech|SGGW|Warsaw University of Life Sciences' site; then
            echo 'Legacy domain text found in generated release'
            exit 1
          fi

      - name: Verify optional server
        run: |
          npm --prefix server ci
          npm --prefix server run build

      - name: Verify platform identity
        run: |
          grep -q "appId: 'com.inmersion.mathcs'" capacitor.config.ts
          grep -q 'com.inmersion.mathcs' android/app/build.gradle
          grep -q '<string name="app_name">Math-CS</string>' android/app/src/main/res/values/strings.xml
          grep -q 'package com.inmersion.mathcs;' android/app/src/main/java/com/inmersion/mathcs/MainActivity.java
